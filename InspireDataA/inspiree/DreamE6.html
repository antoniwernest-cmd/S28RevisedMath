  <style>
    :root{--ink:#203238;--line:#26333b;--cream:#fff8c8;--sky:#eef8ff;--panda:#526b58}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior-y:none;font-family:Arial,sans-serif;color:var(--ink);font-weight:700;background:#f7fff6}button,select{font:inherit}main{height:100dvh;padding:clamp(9px,1.6vw,18px);display:grid;grid-template-rows:auto auto 1fr auto;gap:9px}.prompt{border:3px solid var(--line);border-radius:13px;background:var(--cream);padding:9px 14px;text-align:center;font-size:clamp(18px,2.4vw,29px)}.tally{justify-self:center;border-collapse:collapse;background:#fff;font-size:clamp(15px,1.8vw,22px)}.tally caption{padding:6px;text-decoration:underline;font-size:clamp(19px,2.4vw,28px)}.tally th,.tally td{border:2px solid var(--line);padding:5px 13px;text-align:center}.tally th{background:#e7f6e5}.tally td:nth-child(2){white-space:nowrap}.tally-five,.tally-rest{display:inline-flex;position:relative;height:26px;vertical-align:middle;gap:4px;margin-right:7px}.tally-five i,.tally-rest i{display:block;width:3px;height:25px;background:#172536;border-radius:2px}.tally-five::after{content:"";position:absolute;left:-2px;right:-2px;top:11px;border-top:3px solid #172536}.graph-card{min-height:0;border:4px solid var(--line);border-radius:16px;background:#fff;padding:clamp(8px,1.5vw,16px);display:grid;grid-template-rows:auto 1fr}.graph-card h2{margin:0 0 7px;text-align:center;font-size:clamp(18px,2.4vw,28px)}.graph{min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:4px}.axis-label{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;padding:7px;font-size:clamp(14px,1.7vw,19px)}.chart{min-height:0;display:grid;grid-template-columns:42px 1fr;padding-bottom:56px}.y-axis{display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding-right:5px;font-size:13px}.plot{position:relative;min-height:0;border-left:3px solid var(--line);border-bottom:3px solid var(--line);background-image:linear-gradient(to bottom,#cbd8e4 1px,transparent 1px);background-size:100% calc(100% / 7);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(15px,6vw,80px);padding:0 clamp(16px,7vw,100px)}.bar-area{height:100%;position:relative;display:flex;align-items:center;justify-content:flex-end;flex-direction:column}.bar{width:min(75%,100px);min-height:0;background:linear-gradient(#9fd2f1,#5c9fd0);border:3px solid #285677;border-radius:9px 9px 0 0;transition:height .2s}.bar-controls{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max-content;display:grid;justify-items:center;gap:4px;padding-top:7px}.bar-controls label{font-size:clamp(13px,1.8vw,18px)}select{border:3px solid var(--line);border-radius:8px;background:#fff;padding:3px 8px;font-size:18px}.x-label{grid-column:2;text-align:center;font-size:clamp(14px,1.8vw,19px);padding-top:4px}.footer{display:flex;justify-content:center;align-items:center;gap:11px}.answer-dot{width:22px;height:22px;padding:0!important;border:2px solid #7b1111!important;border-radius:50%!important;background:#e42a2a!important}.feedback{min-height:24px}@media(max-width:600px){.tally th,.tally td{padding:3px 7px}.plot{padding:0 12px;gap:8px}.chart{grid-template-columns:32px 1fr}.y-axis{font-size:10px}.axis-label{font-size:12px}.bar-controls label{font-size:12px}}
  </style>

<body data-import="6">
  <main>
    <div class="prompt">Use the tally chart to build the bar graph. The scale goes up by 2.</div>
    <table class="tally"><caption>Visits to the Panda Exhibit 🐼 on Monday</caption><thead><tr><th>Time</th><th>Tally</th><th>Total</th></tr></thead><tbody><tr><th>Morning</th><td><span class="tally-five"><i></i><i></i><i></i><i></i></span><span class="tally-rest"><i></i><i></i><i></i></span></td><td>8</td></tr><tr><th>Afternoon</th><td><span class="tally-five"><i></i><i></i><i></i><i></i></span><span class="tally-five"><i></i><i></i><i></i><i></i></span><span class="tally-rest"><i></i><i></i></span></td><td>12</td></tr><tr><th>Evening</th><td><span class="tally-five"><i></i><i></i><i></i><i></i></span><span class="tally-five"><i></i><i></i><i></i><i></i></span></td><td>10</td></tr></tbody></table>
    <section class="graph-card"><h2>Visits to the Panda Exhibit 🐼 on Monday</h2><div class="graph"><div class="axis-label">Number of visits</div><div class="chart"><div class="y-axis"><span style="top:0%">14</span><span style="top:14.285714285714285%">12</span><span style="top:28.57142857142857%">10</span><span style="top:42.857142857142854%">8</span><span style="top:57.14285714285714%">6</span><span style="top:71.42857142857143%">4</span><span style="top:85.71428571428571%">2</span><span style="top:100%">0</span></div><div id="plot" class="plot"></div></div><div class="x-label">Time of day</div></div></section>
    <footer class="footer"><span id="feedback" class="feedback" role="status"></span><button id="fillAnswers" class="answer-dot" type="button" aria-label="Fill correct answers" title="Fill correct answers"></button></footer>
  </main>
  <script>
    (()=>{"use strict";const $=id=>document.getElementById(id),student=new URLSearchParams(location.search).get("student")||"student",storageKey="inspiree-panda-bars-"+student,saved=JSON.parse(window.InspireMemory.getItem(storageKey)||"null"),periods=[{id:"morning",label:"Morning",value:8},{id:"afternoon",label:"Afternoon",value:12},{id:"evening",label:"Evening",value:10}],answers=Object.assign({morning:"",afternoon:"",evening:""},saved||{});function assess(){return periods.map(period=>({item:period.label+" bar height",student:answers[period.id]||"No answer",expected:String(period.value),correct:answers[period.id]===String(period.value)}))}function save(){window.InspireMemory.setItem(storageKey,JSON.stringify(answers))}function send(){window.InspireHost.emit();const rows=assess(),got=rows.filter(row=>row.correct).length;parent.postMessage({type:"DREAME_PANDA_BARS",rows,got,available:rows.length},"*")}function render(){const plot=$("plot");plot.innerHTML="";periods.forEach(period=>{const value=Number(answers[period.id]||0),area=document.createElement("section");area.className="bar-area";const bar=document.createElement("div");bar.className="bar";bar.style.height=(value/14*100)+"%";bar.setAttribute("aria-label",period.label+" bar height "+value);const controls=document.createElement("div");controls.className="bar-controls";const label=document.createElement("label");label.textContent=period.label;const select=document.createElement("select");select.setAttribute("aria-label",period.label+" bar height");select.innerHTML='<option value="">Height</option>'+[0,2,4,6,8,10,12,14].map(number=>'<option value="'+number+'">'+number+'</option>').join("");select.value=answers[period.id];select.onchange=()=>{answers[period.id]=select.value;save();render();send()};controls.append(label,select);area.append(bar,controls);plot.append(area)})}$("fillAnswers").onclick=()=>{if(prompt("")!=="259")return;periods.forEach(period=>answers[period.id]=String(period.value));save();render();send()};window.InspireHost.register(()=>({...answers}),v=>{Object.assign(answers,v);render()});render();send()})();
  </script>
