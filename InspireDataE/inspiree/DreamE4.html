<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream E4 | Card Classification Tree</title><style data-inline-css="dreamh.css">:root{--ink:#182c49;--blue:#2f78bd;--sky:#eaf6ff;--cream:#fffaf0;--yellow:#fff1a6;--green:#e4f6e7;--line:#9cb9d4}*{box-sizing:border-box}html,body{overscroll-behavior-y:none}body{margin:0;background:linear-gradient(135deg,#effaff,#fff9e8);color:var(--ink);font-family:Arial,sans-serif}.landing{min-height:100vh;display:grid;place-items:center;padding:20px}.launch{width:min(820px,100%);border:4px solid var(--ink);border-radius:28px;padding:clamp(28px,6vw,68px);background:#fffdf8;box-shadow:10px 10px 0 #b6d8ef}.eyebrow{margin:0;font-weight:900;letter-spacing:1px;color:var(--blue)}h1{margin:10px 0;font-size:clamp(44px,8vw,78px);line-height:.92}.launch h1 span{color:var(--blue)}.launch p{font-size:21px;line-height:1.4}.launch label{display:block;max-width:360px;font-weight:900}.launch input{display:block;width:100%;margin-top:7px;padding:11px;border:3px solid var(--ink);border-radius:10px;background:white}.primary,.nav-link{display:inline-block;margin-top:18px;padding:12px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--yellow);box-shadow:0 4px 0 #74a7d3;color:var(--ink);font-weight:900;text-decoration:none}.shell{min-height:100vh;padding:88px 18px 104px}.topbar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 20px;border-bottom:4px solid var(--ink);background:#fffdf8}.brand{font-size:22px;font-weight:900}.brand small{display:block;color:var(--blue);font-size:11px;letter-spacing:1px}.tools{display:flex;gap:7px;align-items:center}.pill,.tools button{border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:white;font-weight:900}.tools button{background:var(--yellow);cursor:pointer}.page{width:min(1350px,100%);margin:auto}.hero{display:flex;gap:16px;align-items:ce in:5px 0 0;width:100%}.score{margin-top:13px;padding:11px;border:3px solid var(--ink);border-radius:10px;background:var(--green);font-weight:900}.bottom{position:fixed;z-index:20;right:18px;bottom:70px}.modal{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:18px;background:#0009}.modal[hidden]{display:none}.modal section{width:min(700px,100%);max-height:82vh;overflow:auto;border:4px solid var(--ink);border-radius:18px;padding:20px;background:#fffdf8}.modal button{float:right;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;background:var(--yellow);font-weight:900}@media(max-width:900px){.tree{grid-template-columns:1fr}.tree-root{grid-template-columns:1fr 1fr}.branches{grid-template-columns:1fr}.shell{padding-top:108px}.topbar{align-items:flex-start}.brand{font-size:17px}.tools{gap:3px}.tools button,.pill{padding:6px;font-size:11px}}@media(max-width:540px){.type-row{grid-template-columns:1fr}.leaves{grid-template-columns:1fr}.bottom{right:10px;bottom:60px}}@media print{.topbar,.bottom{display:none!important}.shell{padding:0}}
