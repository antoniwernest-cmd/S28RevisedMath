  <style>
    :root{--ink:#223038;--line:#26333b;--pale:#f8fbff;--leaf:#79c96e;--cream:#fff8c8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior-y:none;font-family:Arial,sans-serif;color:var(--ink);font-weight:700;background:#effaf0}button,select{font:inherit}main{height:100dvh;padding:clamp(8px,1.5vw,16px);display:grid;grid-template-rows:auto 1fr auto;gap:10px}.prompt,.bank,.pad{border:3px solid var(--line);border-radius:16px;background:#fff}.prompt{padding:12px 18px;font-size:clamp(18px,2.3vw,28px)}.work{min-height:0;display:grid;grid-template-columns:minmax(190px,260px) 1fr;gap:12px}.bank{display:flex;flex-direction:column;align-items:center;padding:12px;text-align:center;background:linear-gradient(#edffe9,#edfaff)}.bank h2{font-size:clamp(20px,2vw,28px);margin:0 0 8px}.remaining{padding:11px;width:100%;background:var(--cream);border:3px solid var(--line);border-radius:13px;font-size:clamp(25px,3.4vw,44px)}.leaves{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:12px 0;font-size:clamp(20px,2.2vw,31px);line-height:1}.tip{margin-top:auto;font-size:15px}.pads{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.pad{min-height:0;padding:10px;display:grid;grid-template-rows:auto 1fr;background:var(--pale);border-style:dashed}.pad-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(19px,2vw,27px)}select{width:76px;padding:5px;border:3px solid var(--line);border-radius:11px;background:#fff;font-size:22px;font-weight:800}.pad-leaves{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;font-size:clamp(22px,2.8vw,38px);line-height:1}.footer{display:flex;align-items:center;justify-content:center;gap:15px;padding:7px;background:#bdf1b4;border:3px solid var(--line);border-radius:12px}.footer button{padding:8px 18px;border:3px solid var(--line);border-radius:11px;background:var(--cream);cursor:pointer}.answer-dot{width:22px;height:22px;padding:0!important;border:2px solid #7b1111!important;border-radius:50%!important;background:#e42a2a!important}.feedback{min-height:24px;font-size:18px}.correct{background:#cbf4c4}.wrong{background:#ffd7c9}@media(max-width:660px){.work{grid-template-columns:1fr;grid-template-rows:auto 1fr}.bank{display:grid;grid-template-columns:1fr 1fr;gap:7px}.bank h2,.tip{grid-column:1/-1}.bank .leaves{margin:0}.pads{min-height:0}.tip{display:none}.remaining{font-size:25px}.prompt{font-size:17px}.pad{padding:6px}.pad-head{font-size:17px}.pad-leaves{font-size:22px}}
  </style>
<style data-inline-css="import-inner.css">html,body{overscroll-behavior:none}#fillAnswers,#feedback,#score,.topbar,.nav-link,#resetBtn,#submitWork{display:none!important}

<body data-import="2">
  <main>
    <div class="prompt">Share 40 leaves onto 4 pads. Use each dropdown to choose how many leaves go on that pad.</div>
    <div class="work"><aside class="bank"><h2>Large Group of 40 Leaves</h2><div id="remaining" class="remaining">40 leaves left</div><div id="bankLeaves" class="leaves" aria-label="Leaves remaining"></div><p class="tip">When a pad number goes up, leaves leave this group.</p></aside><section id="pads" class="pads" aria-label="Four leaf pads"></section></div>
    <footer class="footer"><span id="feedback" class="feedback" role="status"></span><button id="fillAnswers" class="answer-dot" type="button" aria-label="Fill correct answers" title="Fill correct answers"></button></footer>
  </main>
  <script>
    (()=>{"use strict";const $=id=>document.getElementById(id),student=new URLSearchParams(location.search).get("student")||"student",storageKey="inspiree-leaves-"+student,saved=JSON.parse(window.InspireMemory.getItem(storageKey)||"null"),values=Array.isArray(saved&&saved.values)&&saved.values.length===4?saved.values.map(Number):[0,0,0,0],leaf="🍃";function total(){return values.reduce((a,b)=>a+b,0)}function assess(){return values.map((value,i)=>({item:"Leaf pad "+(i+1),student:String(value),expected:"10",correct:value===10}))}function save(){window.InspireMemory.setItem(storageKey,JSON.stringify({values:[...values]}))}function send(){window.InspireHost.emit();const rows=assess(),got=rows.filter(row=>row.correct).length;parent.postMessage({type:"DREAME_LEAVES",rows,values:[...values],got,available:rows.length},"*")}function render(){const used=total(),left=40-used;$("remaining").textContent=left+" leaves left";$("bankLeaves").textContent=leaf.repeat(Math.max(0,left));const pads=$("pads");pads.innerHTML="";values.forEach((value,i)=>{const box=document.createElement("article"),row=assess()[i];box.className="pad";const head=document.createElement("div");head.className="pad-head";head.innerHTML="<span>Pad "+(i+1)+"</span>";const select=document.createElement("select");select.setAttribute("aria-label","Leaves on pad "+(i+1));for(let n=0;n<=40;n++){const option=document.createElement("option");option.value=n;option.textContent=n;if(n===value)option.selected=true;select.appendChild(option)}select.onchange=()=>{values[i]=Number(select.value);if(total()>40)values[i]=Math.max(0,40-(total()-Number(select.value)));save();render();send()};head.appendChild(select);const leaves=document.createElement("div");leaves.className="pad-leaves";leaves.textContent=leaf.repeat(value);box.append(head,leaves);pads.appendChild(box)})}$("fillAnswers").onclick=()=>{if(prompt("")!=="259")return;values.splice(0,values.length,10,10,10,10);save();render();send()};window.InspireHost.register(()=>({values:[...values]}),v=>{values.splice(0,4,...(v.values||[0,0,0,0]));render()});render();send()})();
  </script>
