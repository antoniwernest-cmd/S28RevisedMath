<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamB · Number Order</title>
  <style>
    :root{--ink:#172b48;--line:#172b48;--blue:#2b78c6;--cream:#fff5c1;--paper:#fff;--pale:#edf7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eff9ff,#f8fcff 52%,#fff9db)}body{overflow:hidden}.page{min-height:100dvh;padding:76px 16px 82px;display:grid;place-items:center}.activity{width:min(1440px,100%);display:grid;gap:14px}.title{margin:0;padding:13px 18px;border:4px solid var(--line);border-radius:16px;background:var(--cream);text-align:center;font-size:clamp(1.25rem,2.4vw,2rem)}.directions{margin:0;text-align:center;font-size:1.05rem;font-weight:700}.bank,.answer-row,.feedback{border:4px solid var(--line);border-radius:15px;background:var(--paper);box-shadow:0 5px 0 rgba(43,120,198,.18)}.bank{padding:14px}.bank h2{margin:0 0 10px;text-align:center;font-size:1.1rem}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.number-card{min-width:104px;min-height:63px;padding:8px;border:3px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 3px 0 #8ab5e3;color:var(--ink);font:800 clamp(1.3rem,2.2vw,1.8rem) "Trebuchet MS",Arial,sans-serif;cursor:grab;touch-action:none}.number-card:active{cursor:grabbing}.number-card.selected{outline:5px solid #f5cb56;transform:translateY(-2px)}.number-card.used{opacity:.32;pointer-events:none}.answer-row{padding:13px 10px;background:var(--pale)}.answer-row h2{margin:0 0 11px;text-align:center;font-size:1.14rem}.pads{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}.pad{min-height:83px;padding:5px;border:3px dashed var(--blue);border-radius:11px;background:#fff;display:grid;place-items:center;cursor:pointer;outline:none}.pad:focus,.pad.over{border-color:#07529c;background:#ddecff}.pad.filled{border-style:solid}.position{font-size:.78rem;font-weight:800;color:#54718d}.pad .number-card{width:100%;min-width:0;min-height:52px;padding:4px;box-shadow:none;font-size:clamp(1rem,1.8vw,1.45rem);cursor:pointer}.feedback{min-height:47px;padding:11px;text-align:center;font-weight:800}.feedback.good{background:#dcf7df;color:#155b2f}.feedback.try{background:#fff0ec;color:#963628}@media(max-width:900px){body{overflow:auto}.page{padding:74px 10px 82px;place-items:start}.pads{grid-template-columns:repeat(3,1fr)}.number-card{min-width:82px;min-height:54px}.pad{min-height:72px}} 
  </style>
<script defer src="../tablet-drag-guard.js?v=20260928-2"></script></head>
<body><script src="dreamb-nav.js?v=20260927-stadium-audit-01"></script><script src="dreamb-next-fallback.js?v=20260927-stadium-audit-01"></script>
  <main class="page"><section class="activity" aria-label="Put numbers in order activity">
    <h1 class="title">Put the 9 numbers in order from least to greatest.</h1>
    <p class="directions">Drag a number to each space. To fix a mistake, drag a placed number to another space to swap them.</p>
    <section class="bank"><h2>Number bank</h2><div class="cards" id="cards"></div></section>
    <section class="answer-row"><h2>Least <span aria-hidden="true">→</span> Greatest</h2><div class="pads" id="pads"></div></section>
    <p class="feedback" id="feedback" aria-live="polite">Put all nine numbers in the row.</p>
  </section></main>
  <script>
    (()=>{
      const numbers=[128,173,246,319,405,478,529,614,688],bankOrder=[478,128,614,319,688,246,405,173,529],cards=document.querySelector('#cards'),pads=document.querySelector('#pads'),feedback=document.querySelector('#feedback');let selected=null,dragged=null;const placed=Array(9).fill(null);
      function card(number,used=false){return '<button type="button" class="number-card '+(used?'used ':'')+(selected===number?'selected ':'')+'" draggable="true" data-number="'+number+'">'+number+'</button>'}
      function render(){cards.innerHTML=bankOrder.map(n=>card(n,placed.includes(n))).join('');cards.querySelectorAll('.number-card').forEach(b=>{b.addEventListener('click',()=>{selected=Number(b.dataset.number);render()});b.addEventListener('dragstart',e=>{dragged=Number(b.dataset.number);e.dataTransfer.setData('text/plain',String(dragged))})});pads.innerHTML=placed.map((n,i)=>'<div class="pad '+(n?'filled':'')+'" data-index="'+i+'" tabindex="0">'+(n?card(n):'<span class="position">'+(i+1)+'</span>')+'</div>').join('');pads.querySelectorAll('.pad').forEach(p=>{p.querySelector('.number-card')?.addEventListener('dragstart',e=>{dragged=Number(e.currentTarget.dataset.number);e.dataTransfer.setData('text/plain',String(dragged))});p.addEventListener('dragover',e=>{e.preventDefault();p.classList.add('over')});p.addEventListener('dragleave',()=>p.classList.remove('over'));p.addEventListener('drop',e=>{e.preventDefault();p.classList.remove('over');put(Number(p.dataset.index),Number(e.dataTransfer.getData('text/plain'))||dragged)});p.addEventListener('click',()=>activate(p));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(p)}})});check()}
      function put(index,number){if(!number)return;const old=placed.indexOf(number);if(old===index)return;const displaced=placed[index];if(old>-1)placed[old]=displaced;placed[index]=number;selected=null;render()}
      function activate(pad){const index=Number(pad.dataset.index);if(selected!==null)put(index,selected);else if(placed[index]!==null){placed[index]=null;feedback.textContent='That number is back in the bank.';feedback.className='feedback';render()}}
      function check(){const complete=!placed.some(n=>n===null),okay=complete&&placed.every((n,i)=>n===numbers[i]);feedback.textContent=!complete?'Put all nine numbers in the row.':okay?'Great ordering! You placed all 9 numbers from least to greatest.':'Check the order and try moving the numbers again.';feedback.className='feedback '+(complete?(okay?'good':'try'):'');try{const student=new URLSearchParams(location.search).get('student')||'Student',key='inspireb-firsthalf-assessment-'+student,record=JSON.parse(localStorage.getItem(key)||'{}');record.pages=record.pages||{};record.pages[15]={...(record.pages[15]||{}),page:15,title:'Number Order',completed:okay,answer:placed,score:placed.filter((number,index)=>number===numbers[index]).length+'/9',questionResults:placed.map((number,index)=>({label:'Position '+(index+1)+' · selected '+(number===null?'—':number)+' · expected '+numbers[index],result:number===null?'Not answered':number===numbers[index]?'Correct':'Incorrect'})),updatedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(record))}catch(_){}}
      render();
    })();
  </script>
</body>
</html>
