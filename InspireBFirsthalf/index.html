*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none;overscroll-behavior-y:none;font-family:Arial,sans-serif;color:#eef7ff;background:#030a1e radial-gradient(circle at 12% 12%,#4665be 0 1px,transparent 2px) 0 0/48px 48px}.card{width:min(1050px,calc(100% - 28px));margin:14px auto;padding:18px;background:#0c2450;border:4px solid #c2dcff;border-radius:20px;box-shadow:8px 8px #3975c6}.head{display:flex;align-items:center;gap:13px;border-bottom:3px solid #8bb8ed;padding-bottom:10px}.head h1{margin:0;font-size:clamp(30px,5vw,52px)}.head p{margin:4px 0 0;font-size:18px;color:#d6eaff}.codes{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:15px 0}.code{min-height:92px;border:3px solid #c2dcff;border-radius:16px;background:#173a75;color:#fff;font:700 clamp(19px,3vw,28px) Arial;cursor:pointer}.code span{display:block;font-size:27px;margin-top:5px}.code.selected{background:#f4d76d;color:#172b48;border-color:#fff7bd;box-shadow:0 0 0 3px #fff7bd}.enter{width:100%;border:3px solid #c2dcff;border-radius:12px;background:#f4d76d;color:#172b48;padding:14px;font:700 23px Arial;cursor:pointer}.hint{text-align:center;min-height:24px;margin:10px 0 0;color:#d6eaff}@media(max-width:680px){.card{margin:8px auto;padding:12px}.codes{grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.code{min-height:66px}.head p{font-size:14px}}

<script>
(()=>{const choices=[['1847','🐝'],['7128','🍯'],['4561','🌻'],['1472','🌈'],['8392','⭐'],['2956','🍎'],['6384','🦋'],['9025','🐞'],['5173','🌱'],['3608','☀️'],['7419','📚'],['2865','✏️'],['4937','🎒'],['8206','🧩'],['1594','🎨'],['6742','⚽'],['3087','🌙'],['9251','🍓']],codes=document.querySelector('#codes'),enter=document.querySelector('#enter'),hint=document.querySelector('#hint');let chosen='';const resetDreamB=student=>{const keys=['inspireb-firsthalf-assessment-'+student,'inspireb-firsthalf-page-drafts-'+student,'inspireb-firsthalf-m26-autofill-'+student,'inspireb-firsthalf-dreamb-clock-answers-'+student,'inspireb-firsthalf-dreamb-paddle-order-'+student,'inspireb-firsthalf-p26-panther-f-1-more-10-more-100-more-state-v1','inspireb-firsthalf-p26-panther-f-before-after-a-state-v1','inspireb-firsthalf-p26-panther-f-regrouping-subtraction-a-v1','inspireb-firsthalf-p26-panther-f-regrouping-subtraction-b-v1','inspireb-firsthalf-p26-team-balance-v1','inspireb-firsthalf-p26-team-more-10-more-100-more-b-state-v1','inspireb-firsthalf-p26-teammystery-cards-v1','inspireb-firsthalf-p26-teampaddle-v1','inspireb-firsthalf-pantherwhatnumberisthis','inspireb-firsthalf-p26-teampaddle-2-v1','inspireb-firsthalf-p26-teampaddle-3-v1','inspireb-firsthalf-p26-teampaddle-4-v1','inspireb-firsthalf-p26-teampaddle-5-v1','inspireb-firsthalf-p26-teampaddle-6-v1','inspireb-firsthalf-p26-teampaddle-7-v1'];try{keys.forEach(key=>localStorage.removeItem(key))}catch(_){}};codes.innerHTML=choices.map(([n,e])=>'<button class="code" type="button" data-code="'+n+'">'+n+'<span aria-hidden="true">'+e+'</span></button>').join('');codes.querySelectorAll('.code').forEach(b=>b.onclick=()=>{chosen=b.dataset.code;codes.querySelectorAll('.code').forEach(x=>x.classList.toggle('selected',x===b));enter.textContent='Enter DreamB Activities →';hint.textContent='Ready to begin!'});enter.onclick=()=>{if(!chosen){hint.textContent='Choose your emoji-number first.';return}resetDreamB(chosen);location.href='DreamB1.html?student='+encodeURIComponent(chosen)}})();
