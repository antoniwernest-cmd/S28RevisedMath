<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamB · Read the Clock</title>
  <style>
    :root{--ink:#172b48;--line:#172b48;--blue:#2678c9;--gold:#f6cc56;--pale:#e9f5ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eefaff,#f7fcff 55%,#fff9db)}body{overflow:hidden}.page{min-height:100dvh;padding:76px 16px 82px;display:grid;place-items:center}.activity{width:min(1360px,100%);display:grid;gap:12px}.title{margin:0;padding:12px;border:4px solid var(--line);border-radius:15px;background:#fff4bd;text-align:center;font-size:clamp(1.25rem,2.4vw,1.95rem)}.directions{margin:0;text-align:center;font-weight:800}.clock-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.clock-card,.bank,.feedback{border:4px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 0 rgba(38,120,201,.2)}.clock-card{padding:9px;display:grid;justify-items:center;gap:8px}.clock{--minute:0deg;--hour:0deg;position:relative;width:min(16vw,170px);min-width:120px;aspect-ratio:1;border:7px solid #234b75;border-radius:50%;background:radial-gradient(circle,#fff 0 63%,#e6f2ff 64% 100%)}.clock:before{content:"";position:absolute;inset:10px;border-radius:50%;background:repeating-conic-gradient(from -1deg,#234b75 0 2deg,transparent 2deg 30deg)}.hand{position:absolute;left:50%;bottom:50%;width:7px;transform-origin:50% 100%;border-radius:6px;background:#172b48;z-index:2}.hour{height:31%;transform:translateX(-50%) rotate(var(--hour))}.minute{height:42%;width:5px;background:#d43e48;transform:translateX(-50%) rotate(var(--minute))}.pin{position:absolute;left:50%;top:50%;width:14px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--gold);border:2px solid var(--line);z-index:3}.pad{width:100%;min-height:51px;border:3px dashed var(--blue);border-radius:10px;background:var(--pale);display:grid;place-items:center;cursor:pointer;font-weight:800}.pad.over,.pad:focus{border-color:#084e96;background:#d8ecff;outline:none}.pad.filled{border-style:solid;background:#fff}.drop-help{font-size:.88rem;color:#56718d}.bank{padding:10px}.bank h2{margin:0 0 9px;text-align:center;font-size:1.05rem}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.time-card{min-width:104px;min-height:52px;padding:6px 12px;border:3px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 3px 0 #9ec6eb;color:var(--ink);font:800 1.35rem "Trebuchet MS",Arial,sans-serif;cursor:grab;touch-action:none}.time-card:active{cursor:grabbing}.time-card.selected{outline:5px solid var(--gold);transform:translateY(-2px)}.time-card.used{opacity:.3;pointer-events:none}.feedback{min-height:45px;padding:10px;text-align:center;font-weight:800}.feedback.good{background:#dcf7df;color:#175a30}.feedback.try{background:#fff0ed;color:#963629}@media(max-width:800px){body{overflow:auto}.page{padding:74px 10px 82px;place-items:start}.clock-row{grid-template-columns:repeat(2,1fr)}.clock{width:min(32vw,150px)}.clock-card{padding:6px}} 
  </style>
<script defer src="../tablet-drag-guard.js?v=20260928-2"></script></head>
<body><script src="dreamb-nav.js?v=20260927-stadium-audit-01"></script><script src="dreamb-next-fallback.js?v=20260927-stadium-audit-01"></script>
  <main class="page"><section class="activity" aria-label="Read the clock activity">
    <h1 class="title">Read each analogue clock. Match it with the digital time.</h1>
    <p class="directions">Drag a time to each clock. To fix a choice, drag a placed time to another clock to move or swap it, or drag it back to the time bank.</p>
    <section class="clock-row" id="clockRow"></section>
    <section class="bank"><h2>Time card bank</h2><div class="choices" id="choices"></div></section>
    <p class="feedback" id="feedback" aria-live="polite">Match all four clocks.</p>
  </section></main>
  <script>
    (()=>{
      const clocks=[{id:'three',time:'3:00',hour:90,minute:0,label:'Three o’clock'},{id:'half',time:'6:30',hour:195,minute:180,label:'Half past six'},{id:'quarterPast',time:'9:15',hour:277.5,minute:90,label:'Quarter past nine'},{id:'quarterTo',time:'1:45',hour:52.5,minute:270,label:'Quarter to two'}];
      const choices=['6:30','2:00','9:15','3:00','1:45','9:45'],student=new URLSearchParams(location.search).get('student')||'Student',clockStorageKey='inspireb-firsthalf-dreamb-clock-answers-'+student,placed={};let selected=null,dragged=null;const row=document.querySelector('#clockRow'),bank=document.querySelector('#choices'),feedback=document.querySelector('#feedback');
      try{const saved=JSON.parse(localStorage.getItem(clockStorageKey)||'{}');clocks.forEach(clock=>{if(choices.includes(saved[clock.id]))placed[clock.id]=saved[clock.id]})}catch(_){}
      function savePlaced(){try{localStorage.setItem(clockStorageKey,JSON.stringify(placed))}catch(_){}}
      function timeCard(time,used=false){return '<button type="button" class="time-card '+(used?'used ':'')+(selected===time?'selected ':'')+'" draggable="true" data-time="'+time+'">'+time+'</button>'}
      function render(){row.innerHTML=clocks.map(c=>'<section class="clock-card"><div class="clock" style="--hour:'+c.hour+'deg;--minute:'+c.minute+'deg" aria-label="'+c.label+'"><i class="hand hour"></i><i class="hand minute"></i><i class="pin"></i></div><div class="pad '+(placed[c.id]?'filled':'')+'" data-clock="'+c.id+'" tabindex="0">'+(placed[c.id]?timeCard(placed[c.id]):'<span class="drop-help">Drop time here</span>')+'</div></section>').join('');bank.innerHTML=choices.map(t=>timeCard(t,Object.values(placed).includes(t))).join('');document.querySelectorAll('.time-card').forEach(card=>{card.addEventListener('click',()=>{selected=card.dataset.time;render()});card.addEventListener('dragstart',e=>{dragged=card.dataset.time;e.dataTransfer.setData('text/plain',dragged)})});bank.ondragover=e=>{e.preventDefault();bank.classList.add('over')};bank.ondragleave=()=>bank.classList.remove('over');bank.ondrop=e=>{e.preventDefault();bank.classList.remove('over');returnToBank(e.dataTransfer.getData('text/plain')||dragged)};document.querySelectorAll('.pad').forEach(p=>{p.addEventListener('dragover',e=>{e.preventDefault();p.classList.add('over')});p.addEventListener('dragleave',()=>p.classList.remove('over'));p.addEventListener('drop',e=>{e.preventDefault();p.classList.remove('over');put(p.dataset.clock,e.dataTransfer.getData('text/plain')||dragged)});p.addEventListener('click',()=>activate(p));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(p)}})});check()}
      function put(clock,time){if(!time)return;if(placed[clock]===time){selected=null;return}const source=Object.keys(placed).find(key=>placed[key]===time),replaced=placed[clock];if(source&&source!==clock){if(replaced)placed[source]=replaced;else delete placed[source]}placed[clock]=time;selected=null;savePlaced();render()}
      function returnToBank(time){const source=Object.keys(placed).find(key=>placed[key]===time);if(!source)return;delete placed[source];selected=null;savePlaced();render()}
      function activate(pad){const clock=pad.dataset.clock;if(selected){put(clock,selected);return}if(placed[clock]){delete placed[clock];savePlaced();feedback.textContent='That time is back in the bank.';feedback.className='feedback';render()}}
      function check(){const complete=Object.keys(placed).length===4,okay=complete&&clocks.every(c=>placed[c.id]===c.time);feedback.textContent=!complete?'Match all four clocks.':okay?'Excellent! You read the hour, half-hour, quarter past, and quarter to.':'Check the clock hands and try again.';feedback.className='feedback '+(complete?(okay?'good':'try'):'');try{const key='inspireb-firsthalf-assessment-'+student,record=JSON.parse(localStorage.getItem(key)||'{}');record.pages=record.pages||{};record.pages[16]={...(record.pages[16]||{}),page:16,title:'Read the Clock',completed:okay,answer:placed,score:clocks.filter(clock=>placed[clock.id]===clock.time).length+'/4',questionResults:clocks.map(clock=>({label:clock.label+' · dropped '+(placed[clock.id]||'—')+' · expected '+clock.time,result:!placed[clock.id]?'Not answered':placed[clock.id]===clock.time?'Correct':'Incorrect'})),updatedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(record))}catch(_){}}
      render();
    })();
  </script>
</body>
</html>
